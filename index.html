<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2b27a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Grand Theft Auckland</title>
  </head>
  <body>
    <div id="app">
      <div id="hud" class="hidden">
        <div id="speedo" class="speedo hidden"><span id="speed">0</span><small>km/h</small></div>
        <div id="fps"></div>
        <button id="mute" aria-label="Mute">🔊</button>
        <div id="prompt"></div>
        <div class="keys">WASD move/drive · Shift run · Space jump/handbrake · F get in/out · R flip · M mute</div>
      </div>
      <div id="splash">
        <h1>Grand Theft<br /><span>Auckland</span></h1>
        <p class="sub">Test town · purple '95 Corolla · get in, get out, make some noise</p>
        <p id="status">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
